<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>72 hodin – Tábor (v2)</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#071521">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="logo" aria-label="Logo města">
        <img src="../assets/cities/tabor/logo.svg" alt="Tábor">
      </div>
      <h1>72 hodin – Tábor</h1>
      <p class="sub">Offline vyhledávač krizových postupů (v2)</p>

      <div class="search">
        <input id="q" type="search" placeholder="Napiš dotaz… (např. blackout, voda, plyn, konflikt)" autocomplete="off">
        <button id="go" type="button">Hledat</button>
      </div>

      <div class="quick">
        <div class="pill danger" data-q="112 155 158">Tísňová volání</div>
        <div class="pill accent" data-q="blackout">Blackout</div>
        <div class="pill" data-q="plyn">Plyn</div>
        <div class="pill" data-q="voda">Voda</div>
        <div class="pill" data-q="zima">Zima</div>
        <div class="pill" data-q="konflikt">Konflikt</div>
      </div>
    </div>
  </div>

  <div id="results" aria-live="polite">
    <div class="rwrap">
      <div class="rtop">
        <button id="close" type="button">Zavřít</button>
        <div class="q" id="qinfo"></div>
      </div>
      <div id="list"></div>
    </div>
  </div>

  <script defer src="./app.js"></script>
</body>
</html>
