<!doctype html>
<html lang="cs">
<head>
 <meta charset="utf-8" />
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
 <title>Tábor</title>

 <style>
 :root{
 --bg:#070b12;
 --line:rgba(255,255,255,.10);
 --txt:#eaf0f7;
 --muted:rgba(234,240,247,.70);
 --shadow: 0 18px 60px rgba(0,0,0,.55);
 }
 *{box-sizing:border-box}
 body{
 margin:0;
 background:
 radial-gradient(1200px 700px at 50% -10%, rgba(120,180,255,.18), transparent 55%),
 radial-gradient(900px 600px at 20% 10%, rgba(80,255,200,.08), transparent 55%),
 var(--bg);
 color:var(--txt);
 font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
 }
 .wrap{max-width:980px;margin:0 auto;padding:28px 16px 56px}

 .hero{
 background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
 border:1px solid var(--line);
 border-radius:28px;
 padding:18px 16px 16px;
 box-shadow:var(--shadow);
 backdrop-filter: blur(10px);
 }

 /* ROW: logo vlevo + text vpravo (mobile-fit) */
 .topRow{
 display:flex;
 align-items:center;
 gap:14px;
 justify-content:space-between;
 padding:6px 4px 10px;
 }
 .logo{
 flex:0 0 auto;
 width:min(44vw, 240px);
 max-width:240px;
 }
 .logo img{
 width:100%;
 height:auto;
 max-height:86px;
 object-fit:contain;
 display:block;
 filter: drop-shadow(0 10px 26px rgba(0,0,0,.55));
 }
 .titleBox{
 flex:1 1 auto;
 min-width:0;
 text-align:left;
 }
 .title{
 margin:0;
 font-weight:950;
 letter-spacing:.2px;
 font-size:clamp(28px, 5.6vw, 46px);
 line-height:1.02;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
 }
 .subtitle{
 margin:6px 0 0;
 color:var(--muted);
 font-size:clamp(12.5px, 2.4vw, 16px);
 line-height:1.25;
 }

 .search{margin:10px auto 0;max-width:820px;display:flex;flex-direction:column;gap:10px}
 .input{
 width:100%;
 padding:18px 18px;
 border-radius:18px;
 border:1px solid var(--line);
 background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
 color:var(--txt);
 font-size:18px;
 outline:none;
 }
 .input:focus{
 border-color:rgba(120,180,255,.55);
 box-shadow:0 0 0 4px rgba(120,180,255,.12);
 }
 .hint{text-align:center;color:var(--muted);font-size:13px}

 .results{margin:18px auto 0;max-width:820px}
 .item{padding:14px 6px;border-bottom:1px solid rgba(255,255,255,.08)}
 .item:last-child{border-bottom:none}
 .item .t{font-weight:900;margin:0 0 6px;font-size:16px;letter-spacing:.1px}
 .item .p{margin:0;color:rgba(234,240,247,.86);white-space:pre-wrap;line-height:1.45}

 @media (max-width:520px){
 .wrap{padding:22px 14px 44px}
 .hero{padding:16px 14px 14px}
 .logo{width:42vw;max-width:210px}
 .logo img{max-height:78px}
 .input{padding:16px 16px}
 .subtitle{margin-top:4px}
 }
 </style>

<style>
/*__UI_HOTFIX_V1__*/
:root {
  /* municipal / official dark palette */
  --bg0: #07111b;
  --bg1: #0a1a2a;
  --bg2: #081623;
  --card: rgba(255,255,255,0.06);
  --card2: rgba(255,255,255,0.08);
  --text: rgba(255,255,255,0.92);
  --muted: rgba(255,255,255,0.78);
}

html, body {
  height: 100%;
}

body {
  background-color: var(--bg0) !important;
  /* NO repeat, NO pattern, only layered gradients */
  background-image:
    radial-gradient(1200px 600px at 50% -120px, rgba(58, 141, 255, 0.18), rgba(58, 141, 255, 0) 60%),
    radial-gradient(900px 500px at 15% 10%, rgba(0, 210, 255, 0.08), rgba(0, 210, 255, 0) 55%),
    linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 45%, var(--bg0) 100%) !important;
  background-repeat: no-repeat !important;
  background-attachment: fixed !important;
  color: var(--text) !important;
}

/* subtitle centered under logo+title */
.__app_subtitle_v1 {
  display: block !important;
  width: 100% !important;
  text-align: center !important;
  font-size: 12px !important;
  line-height: 1.25 !important;
  letter-spacing: 0.2px !important;
  color: var(--muted) !important;
  margin-top: 6px !important;
  opacity: 0.92 !important;
}

</style>


<style>

/*__COLOR_LOCK_V1__*/
:root{
  /* OFFICIAL MUNICIPAL CRISIS PALETTE (DARK - match screenshot) */
  --bg-main:#06111b;
  --bg-gradient-top:#0a2033;
  --bg-gradient-bottom:#06111b;

  /* panels darker (less glass) */
  --panel-bg:rgba(255,255,255,0.06);
  --panel-border:rgba(255,255,255,0.10);

  --text-main:rgba(255,255,255,0.94);
  --text-secondary:rgba(255,255,255,0.78);
  --text-muted:rgba(255,255,255,0.62);

  /* accent very subtle */
  --accent-soft:rgba(120,200,220,0.20);

  /* input darker */
  --input-bg:rgba(0,0,0,0.22);
  --input-border:rgba(255,255,255,0.10);
  --input-border-focus:rgba(120,200,220,0.28);
  --placeholder:rgba(255,255,255,0.38);
}

html,body{
  background:var(--bg-main)!important;
  color:var(--text-main)!important;
}

body{
  background-color:var(--bg-main)!important;
  background-image:
    radial-gradient(1200px 600px at 50% -140px, var(--accent-soft), transparent 62%),
    linear-gradient(180deg, var(--bg-gradient-top) 0%, var(--bg-gradient-bottom) 100%)!important;
  background-repeat:no-repeat!important;
  background-attachment:fixed!important;
}

/* main header panel */
.hero{
  background:var(--panel-bg)!important;
  border:1px solid var(--panel-border)!important;
  box-shadow:0 12px 46px rgba(0,0,0,0.55)!important;
  backdrop-filter:saturate(110%) blur(10px);
}

.topRow{
  border-bottom:1px solid rgba(255,255,255,0.06)!important;
}

.title{ color:var(--text-main)!important; }
.subtitle{ color:var(--text-secondary)!important; }

.search{
  border-top:1px solid rgba(255,255,255,0.06)!important;
}

.input{
  background:var(--input-bg)!important;
  border:1px solid var(--input-border)!important;
  color:var(--text-main)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.04)!important;
}

.input::placeholder{ color:var(--placeholder)!important; }

.input:focus{
  outline:none!important;
  border-color:var(--input-border-focus)!important;
  box-shadow:
    0 0 0 2px rgba(120,200,220,0.12),
    inset 0 1px 0 rgba(255,255,255,0.04)!important;
}

.hint{ color:var(--text-muted)!important; }
.results{ color:var(--text-secondary)!important; }

a{ color:rgba(185,235,245,0.92)!important; }


</style>
<style>
/*__CONTACTS_PANEL_CSS_V1__*/
.contactsPanel{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.06);}
.contactsPanel[hidden]{display:none!important;}

/* THEME_A_STATE_BLACK_SILVER_BEGIN */
/* Variant A — State Black / Silver (colors only) */
:root{--bg:#0E0F12;--panel:#15171C;--panel2:#111317;--text:#E6E8EB;--text2:#A9AFB7;--div:#2A2E36;--focus:#C9CCD2;}
html,body{background:var(--bg)!important;color:var(--text)!important;}
a,a:visited{color:var(--focus)!important;}
input,textarea,select,button{background:var(--panel)!important;color:var(--text)!important;border-color:var(--div)!important;}
button:hover{background:var(--panel2)!important;}
#contactsPanel{border-top-color:var(--div)!important;}
#contactsBody{color:var(--text2)!important;}





/* THEME_A_STATE_BLACK_SILVER_END */

/* CONTACTS_TYPO_A_BEGIN */
/* Contacts — unify typography with results; CSS-only; NO content/JS change */
#contactsBody{
  /* kill monospace feel from <pre> */
  font-family: inherit;
  font-size:14px;                 /* align with results body */
  line-height:1.55;
  font-weight:500;
  letter-spacing:.12px;

  /* keep line breaks, but allow wrapping on small screens */
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:break-word;

  /* match palette */
  color:var(--text-secondary, rgba(255,255,255,.78));
}

/* keep title subtle and consistent */
#contactsPanel .contactsTitle{
  font-family: inherit;
  font-size:12px;
  letter-spacing:.2px;
  color:var(--text-muted, rgba(255,255,255,.62));
}

/* selection readability */
#contactsBody::selection{
  background:rgba(201,204,210,.18);
}
/* CONTACTS_TYPO_A_END */




/* TYPO_A_RESULTS_BEGIN */
/* Typo A v2 — Professional crisis typography (CSS only, correct selectors) */
#results{margin-top:10px;}
#results .item{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:10px 10px 9px 10px;margin:10px 0;}
#results .item .t{font-weight:800;letter-spacing:.2px;line-height:1.2;margin:0 0 6px 0;color:var(--text,rgba(255,255,255,0.92));}
#results .item .p{white-space:pre-wrap;line-height:1.5;color:var(--text-secondary,rgba(255,255,255,0.78));font-size:14px;margin:0;}
#results .item .p strong{font-weight:800;}
#results .item .p em{font-style:italic;}
#contactsBody{line-height:1.5;color:var(--text-secondary,rgba(255,255,255,0.78));}
/* TYPO_A_V2_OK */
/* TYPO_A_RESULTS_END */




.contactsTitle{font-size:12px;letter-spacing:.2px;opacity:.92;margin:0 0 6px 0;color:var(--text-muted,rgba(255,255,255,0.62));}
.contactsBody{margin:0;white-space:pre-wrap;font-size:13px;line-height:1.35;color:var(--text-secondary,rgba(255,255,255,0.78));}
</style>
</head>

<body>
 <div class="wrap">
 <section class="hero">
 <div class="topRow">
 <div class="logo">
 <img src="../assets/cities/tabor/logo.jpg" alt="Město Tábor">
 </div>
 <div class="titleBox">
 <h1 class="title">72 hodin</h1>
 <p class="subtitle">Offline krizový vyhledávač pro občany města Tábor</p>
 </div>
 </div>

 <div class="search">
 <input id="q" class="input" type="search" placeholder="Hledej… (např. voda, blackout, evakuace)" autocomplete="off" />
  <!--__CONTACTS_PANEL_HTML_V1__-->
  <div id="contactsPanel" class="contactsPanel" hidden>
    <div class="contactsTitle">Kontakty</div>
    <pre id="contactsBody" class="contactsBody"></pre>
  </div>

 <div class="hint"></div>
 </div>
 </section>

 <div id="results" class="results"></div>
 </div>

 <script src="./search-core.js"></script>
 <script src="./app.js"></script>

<script>
//__UI_HOTFIX_JS_V1__
(function() {
  const SLOGAN = "Jedno pole. Jedno hledání. Nic navíc.";
  const SUB_PHRASE = "Offline krizový vyhledávač";

  function textIncludes(el, needle) {
    try {
      return !!(el && el.textContent && el.textContent.toLowerCase().includes(needle.toLowerCase()));
    } catch (e) {
      return false;
    }
  }

  function findFirstByText(root, needle) {
    if (!root) return null;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT, null);
    let node = walker.currentNode;
    while (node) {
      if (textIncludes(node, needle)) return node;
      node = walker.nextNode();
    }
    return null;
  }

  function closestHeaderRoot(el) {
    // headerRoot = nejbližší container, který obsahuje obrázek (logo) + text "72 hodin"
    let n = el;
    for (let i = 0; i < 12 && n; i++) {
      const hasImg = !!(n.querySelector && n.querySelector("img"));
      const has72  = textIncludes(n, "72 hodin");
      if (hasImg && has72) return n;
      n = n.parentElement;
    }
    return null;
  }

  function removeSloganIfAny() {
    const root = document.body || document.documentElement;
    const el = findFirstByText(root, SLOGAN);
    if (!el) return;
    // remove the smallest descendant that still contains slogan
    let target = el;
    for (let i = 0; i < 8; i++) {
      const child = Array.from(target.children || []).find(c => textIncludes(c, SLOGAN));
      if (!child) break;
      target = child;
    }
    try { target.remove(); } catch(e){}
  }

  function injectCenteredSubtitle() {
    const root = document.body || document.documentElement;

    const subEl0 = findFirstByText(root, SUB_PHRASE);
    if (!subEl0) return;

    // tighten to smallest element still containing SUB_PHRASE
    let subEl = subEl0;
    for (let i = 0; i < 8; i++) {
      const child = Array.from(subEl.children || []).find(c => textIncludes(c, SUB_PHRASE));
      if (!child) break;
      subEl = child;
    }

    // find header root starting from subtitle or from "72 hodin"
    const headerRoot =
      closestHeaderRoot(subEl) ||
      closestHeaderRoot(findFirstByText(root, "72 hodin"));

    if (!headerRoot) return;

    // avoid duplicates if already injected
    if (headerRoot.querySelector && headerRoot.querySelector(".__app_subtitle_v1[data-injected='1']")) {
      // ensure original subtitle is hidden
      try { subEl.style.display = "none"; } catch(e){}
      return;
    }

    // create new subtitle node
    const injected = document.createElement("div");
    injected.className = "__app_subtitle_v1";
    injected.setAttribute("data-injected", "1");
    injected.textContent = (subEl.textContent || "").trim();

    // place AFTER headerRoot (not inside; no impact on logo/title layout)
    const parent = headerRoot.parentElement;
    if (parent) {
      parent.insertBefore(injected, headerRoot.nextSibling);
    }

    // hide original subtitle to prevent duplicate text (but DO NOT move/remove)
    try { subEl.style.display = "none"; } catch(e){}
  }

  document.addEventListener("DOMContentLoaded", function() {
    try { removeSloganIfAny(); } catch(e){}
    try { injectCenteredSubtitle(); } catch(e){}
  });
})();

</script>

</body>
</html>
