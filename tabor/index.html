<!doctype html>
<html lang="cs">
<head>
 <meta charset="utf-8" />
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
 <title>Tábor</title>

 <style>
 :root{
 --bg:#070b12;
 --line:rgba(255,255,255,.10);
 --txt:#eaf0f7;
 --muted:rgba(234,240,247,.70);
 --shadow: 0 18px 60px rgba(0,0,0,.55);
 }
 *{box-sizing:border-box}
 body{
 margin:0;
 background:
 radial-gradient(1200px 700px at 50% -10%, rgba(120,180,255,.18), transparent 55%),
 radial-gradient(900px 600px at 20% 10%, rgba(80,255,200,.08), transparent 55%),
 var(--bg);
 color:var(--txt);
 font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
 }
 .wrap{max-width:980px;margin:0 auto;padding:28px 16px 56px}

 .hero{
 background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
 border:1px solid var(--line);
 border-radius:28px;
 padding:18px 16px 16px;
 box-shadow:var(--shadow);
 backdrop-filter: blur(10px);
 }

 /* ROW: logo vlevo + text vpravo (mobile-fit) */
 .topRow{
 display:flex;
 align-items:center;
 gap:14px;
 justify-content:space-between;
 padding:6px 4px 10px;
 }
 .logo{
 flex:0 0 auto;
 width:min(44vw, 240px);
 max-width:240px;
 }
 .logo img{
 width:100%;
 height:auto;
 max-height:86px;
 object-fit:contain;
 display:block;
 filter: drop-shadow(0 10px 26px rgba(0,0,0,.55));
 }
 .titleBox{
 flex:1 1 auto;
 min-width:0;
 text-align:left;
 }
 .title{
 margin:0;
 font-weight:950;
 letter-spacing:.2px;
 font-size:clamp(28px, 5.6vw, 46px);
 line-height:1.02;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
 }
 .subtitle{
 margin:6px 0 0;
 color:var(--muted);
 font-size:clamp(12.5px, 2.4vw, 16px);
 line-height:1.25;
 }

 .search{margin:10px auto 0;max-width:820px;display:flex;flex-direction:column;gap:10px}
 .input{
 width:100%;
 padding:18px 18px;
 border-radius:18px;
 border:1px solid var(--line);
 background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
 color:var(--txt);
 font-size:18px;
 outline:none;
 }
 .input:focus{
 border-color:rgba(120,180,255,.55);
 box-shadow:0 0 0 4px rgba(120,180,255,.12);
 }
 .hint{text-align:center;color:var(--muted);font-size:13px}

 .results{margin:18px auto 0;max-width:820px}
 .item{padding:14px 6px;border-bottom:1px solid rgba(255,255,255,.08)}
 .item:last-child{border-bottom:none}
 .item .t{font-weight:900;margin:0 0 6px;font-size:16px;letter-spacing:.1px}
 .item .p{margin:0;color:rgba(234,240,247,.86);white-space:pre-wrap;line-height:1.45}

 @media (max-width:520px){
 .wrap{padding:22px 14px 44px}
 .hero{padding:16px 14px 14px}
 .logo{width:42vw;max-width:210px}
 .logo img{max-height:78px}
 .input{padding:16px 16px}
 .subtitle{margin-top:4px}
 }
 </style>

<style>
/*__UI_HOTFIX_V1__*/
:root {
  /* municipal / official dark palette */
  --bg0: #07111b;
  --bg1: #0a1a2a;
  --bg2: #081623;
  --card: rgba(255,255,255,0.06);
  --card2: rgba(255,255,255,0.08);
  --text: rgba(255,255,255,0.92);
  --muted: rgba(255,255,255,0.78);
}

html, body {
  height: 100%;
}

body {
  background-color: var(--bg0) !important;
  /* NO repeat, NO pattern, only layered gradients */
  background-image:
    radial-gradient(1200px 600px at 50% -120px, rgba(58, 141, 255, 0.18), rgba(58, 141, 255, 0) 60%),
    radial-gradient(900px 500px at 15% 10%, rgba(0, 210, 255, 0.08), rgba(0, 210, 255, 0) 55%),
    linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 45%, var(--bg0) 100%) !important;
  background-repeat: no-repeat !important;
  background-attachment: fixed !important;
  color: var(--text) !important;
}

/* subtitle centered under logo+title */
.__app_subtitle_v1 {
  display: block !important;
  width: 100% !important;
  text-align: center !important;
  font-size: 12px !important;
  line-height: 1.25 !important;
  letter-spacing: 0.2px !important;
  color: var(--muted) !important;
  margin-top: 6px !important;
  opacity: 0.92 !important;
}

</style>


<style>

/*__COLOR_LOCK_V1__*/
:root {
  /* OFFICIAL MUNICIPAL CRISIS PALETTE */
  --bg-main: #07131f;
  --bg-gradient-top: #0b2236;
  --bg-gradient-bottom: #07131f;

  --panel-bg: rgba(255,255,255,0.06);
  --panel-bg-2: rgba(255,255,255,0.08);
  --panel-border: rgba(255,255,255,0.10);

  --text-main: rgba(255,255,255,0.94);
  --text-secondary: rgba(255,255,255,0.78);
  --text-muted: rgba(255,255,255,0.62);

  --accent-soft: rgba(120,200,220,0.35);
  --accent-line: rgba(120,200,220,0.22);

  --input-bg: rgba(0,0,0,0.18);
  --input-border: rgba(255,255,255,0.10);
  --input-border-focus: rgba(120,200,220,0.35);
  --placeholder: rgba(255,255,255,0.40);
}

body {
  background-color: var(--bg-main) !important;
  background-image:
    radial-gradient(1200px 600px at 50% -120px, var(--accent-soft), transparent 60%),
    radial-gradient(900px 520px at 10% 10%, rgba(120,200,220,0.12), transparent 55%),
    linear-gradient(180deg, var(--bg-gradient-top) 0%, var(--bg-gradient-bottom) 100%) !important;
  background-repeat: no-repeat !important;
  background-attachment: fixed !important;
  color: var(--text-main) !important;
}

/* TOP PANEL (the main rounded header container) */
.hero {
  background: var(--panel-bg) !important;
  border: 1px solid var(--panel-border) !important;
}

/* subtle separation line / accents */
.topRow {
  border-bottom: 1px solid rgba(255,255,255,0.06) !important;
}

/* Titles */
.title { color: var(--text-main) !important; }
.subtitle { color: var(--text-secondary) !important; }

/* Search input */
.search {
  border-top: 1px solid rgba(255,255,255,0.06) !important;
}

.input {
  background: var(--input-bg) !important;
  border: 1px solid var(--input-border) !important;
  color: var(--text-main) !important;
}

.input::placeholder { color: var(--placeholder) !important; }

.input:focus {
  outline: none !important;
  border-color: var(--input-border-focus) !important;
}

/* Hint + results */
.hint { color: var(--text-muted) !important; }

.results {
  color: var(--text-secondary) !important;
}

/* Links (if any) */
a { color: rgba(180,230,240,0.92) !important; }


</style>
</head>

<body>
 <div class="wrap">
 <section class="hero">
 <div class="topRow">
 <div class="logo">
 <img src="../assets/cities/tabor/logo.jpg" alt="Město Tábor">
 </div>
 <div class="titleBox">
 <h1 class="title">72 hodin</h1>
 <p class="subtitle">Offline krizový vyhledávač pro občany města Tábor</p>
 </div>
 </div>

 <div class="search">
 <input id="q" class="input" type="search" placeholder="Hledej… (např. voda, blackout, evakuace)" autocomplete="off" />
 <div class="hint"></div>
 </div>
 </section>

 <div id="results" class="results"></div>
 </div>

 <script src="./search-core.js"></script>
 <script src="./app.js"></script>

<script>
//__UI_HOTFIX_JS_V1__
(function() {
  const SLOGAN = "Jedno pole. Jedno hledání. Nic navíc.";
  const SUB_PHRASE = "Offline krizový vyhledávač";

  function textIncludes(el, needle) {
    try {
      return !!(el && el.textContent && el.textContent.toLowerCase().includes(needle.toLowerCase()));
    } catch (e) {
      return false;
    }
  }

  function findFirstByText(root, needle) {
    if (!root) return null;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT, null);
    let node = walker.currentNode;
    while (node) {
      if (textIncludes(node, needle)) return node;
      node = walker.nextNode();
    }
    return null;
  }

  function closestHeaderRoot(el) {
    // headerRoot = nejbližší container, který obsahuje obrázek (logo) + text "72 hodin"
    let n = el;
    for (let i = 0; i < 12 && n; i++) {
      const hasImg = !!(n.querySelector && n.querySelector("img"));
      const has72  = textIncludes(n, "72 hodin");
      if (hasImg && has72) return n;
      n = n.parentElement;
    }
    return null;
  }

  function removeSloganIfAny() {
    const root = document.body || document.documentElement;
    const el = findFirstByText(root, SLOGAN);
    if (!el) return;
    // remove the smallest descendant that still contains slogan
    let target = el;
    for (let i = 0; i < 8; i++) {
      const child = Array.from(target.children || []).find(c => textIncludes(c, SLOGAN));
      if (!child) break;
      target = child;
    }
    try { target.remove(); } catch(e){}
  }

  function injectCenteredSubtitle() {
    const root = document.body || document.documentElement;

    const subEl0 = findFirstByText(root, SUB_PHRASE);
    if (!subEl0) return;

    // tighten to smallest element still containing SUB_PHRASE
    let subEl = subEl0;
    for (let i = 0; i < 8; i++) {
      const child = Array.from(subEl.children || []).find(c => textIncludes(c, SUB_PHRASE));
      if (!child) break;
      subEl = child;
    }

    // find header root starting from subtitle or from "72 hodin"
    const headerRoot =
      closestHeaderRoot(subEl) ||
      closestHeaderRoot(findFirstByText(root, "72 hodin"));

    if (!headerRoot) return;

    // avoid duplicates if already injected
    if (headerRoot.querySelector && headerRoot.querySelector(".__app_subtitle_v1[data-injected='1']")) {
      // ensure original subtitle is hidden
      try { subEl.style.display = "none"; } catch(e){}
      return;
    }

    // create new subtitle node
    const injected = document.createElement("div");
    injected.className = "__app_subtitle_v1";
    injected.setAttribute("data-injected", "1");
    injected.textContent = (subEl.textContent || "").trim();

    // place AFTER headerRoot (not inside; no impact on logo/title layout)
    const parent = headerRoot.parentElement;
    if (parent) {
      parent.insertBefore(injected, headerRoot.nextSibling);
    }

    // hide original subtitle to prevent duplicate text (but DO NOT move/remove)
    try { subEl.style.display = "none"; } catch(e){}
  }

  document.addEventListener("DOMContentLoaded", function() {
    try { removeSloganIfAny(); } catch(e){}
    try { injectCenteredSubtitle(); } catch(e){}
  });
})();

</script>

</body>
</html>
