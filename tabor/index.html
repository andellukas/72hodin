<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>72 hodin – Tábor</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#071521">
  <link rel="stylesheet" href="../shared/ui.css">
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="logo"><img id="cityLogo" alt="Logo města"></div>
      <div class="title">
        <b id="cityTitle">72 hodin</b>
        <span id="citySubtitle">Offline krizový vyhledávač</span>
      </div>
    </div>

    <div class="search">
      <input id="q" autocomplete="off" inputmode="search" placeholder="Zadej dotaz (např. blackout, voda, zima, úraz)…">
      <small>Enter</small>
    </div>

    <div class="row">
      <a class="btn danger" href="tel:112">☎ 112</a>
      <a class="btn" href="tel:150">🚒 150</a>
      <a class="btn" href="tel:158">🚓 158</a>
      <button class="btn accent" id="openOffline">Offline stránka</button>
    </div>

    <div class="hint" id="status">Načítám data…</div>

    <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <button id="resetCacheBtn" type="button"
        style="padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:#fff;font-weight:800">
        RESET CACHE (když visí načítání)
      </button>
      <button id="hardReloadBtn" type="button"
        style="padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.15);color:#fff;font-weight:700">
        HARD RELOAD (vynutit ?v)
      </button>
    </div>
  </div>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="panel">
      <div class="panelHead">
        <b id="ovTitle">Výsledky</b>
        <button id="ovClose">Zavřít (Esc)</button>
      </div>
      <div class="results" id="results"></div>
    </div>
  </div>

  <script type="module" src="./app.v2.js?v20260131_143441"></script>
</body>
</html>
