<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>72 hodin – Offline self-test</title>
<meta name="theme-color" content="#003a8f">
<style>
  :root{--bg:#f6f7f9;--card:#fff;--text:#111;--muted:#555;--blue:#003a8f;--ok:#0a7a2f;--bad:#b00020;--r:18px;--shadow:0 2px 6px rgba(0,0,0,.08)}
  body{font-family:system-ui,Arial;margin:0;background:var(--bg);color:var(--text)}
  header{background:var(--blue);color:#fff;padding:16px 18px}
  main{max-width:900px;margin:auto;padding:18px}
  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin:12px 0}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  button{border:0;background:#0b5bd3;color:#fff;padding:10px 14px;border-radius:999px;font-weight:800;cursor:pointer}
  .pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800}
  .ok{background:#e8f7ee;color:var(--ok);border:1px solid #bfe8cc}
  .bad{background:#fff1f1;color:var(--bad);border:1px solid #f1b2b2}
  pre{white-space:pre-wrap;background:#eef1f7;border-radius:14px;padding:12px;overflow:auto}
  a{color:#0b5bd3;text-decoration:none}
</style>
</head>
<body>
<header>
  <div style="font-weight:900;font-size:18px">Offline self-test</div>
  <div style="opacity:.9;font-size:13px">Ověření service workeru, cache a offline fetch</div>
</header>
<main>
  <div class="card">
    <div class="row">
      <button id="run">Spustit test</button>
      <span id="net" class="pill bad">offline?</span>
      <span id="sw" class="pill bad">SW?</span>
      <span id="cache" class="pill bad">CACHE?</span>
      <span id="fetch" class="pill bad">FETCH?</span>
    </div>
  </div>

  <div class="card">
    <pre id="log">Klikni na "Spustit test".</pre>
  </div>

  <div class="card">
    <a href="index.html">← Zpět do aplikace</a> · <a href="help.html">Nápověda</a>
  </div>
</main>

<script>
const $ = (id)=>document.getElementById(id);
function pill(id, ok, text){
  const el=$(id);
  el.className = "pill " + (ok ? "ok" : "bad");
  el.textContent = text;
}
function log(msg){
  $("log").textContent += "\\n" + msg;
}
function setNet(){
  pill("net", navigator.onLine, navigator.onLine ? "ONLINE" : "OFFLINE");
}
window.addEventListener("online", setNet);
window.addEventListener("offline", setNet);
setNet();

$("run").onclick = async ()=>{
  $("log").textContent = "Test start…";
  setNet();

  // SW
  const hasSW = ("serviceWorker" in navigator);
  pill("sw", hasSW, hasSW ? "SW OK" : "SW NO");
  if(!hasSW){ log("ServiceWorker není podporován."); return; }

  try{
    const reg = await navigator.serviceWorker.getRegistration();
    if(!reg){
      log("SW registrace nenalezena → načti index.html a počkej, nebo refresh.");
    }else{
      log("SW scope: " + reg.scope);
    }
  }catch(e){
    log("SW check error: " + e);
  }

  // Cache check
  try{
    const keys = await caches.keys();
    pill("cache", keys.length>0, keys.length>0 ? "CACHE OK" : "CACHE EMPTY");
    log("Cache keys: " + (keys.join(", ") || "(none)"));
  }catch(e){
    pill("cache", false, "CACHE ERR");
    log("Cache error: " + e);
  }

  // Fetch test (should work even offline if cached)
  try{
    const r = await fetch("faq.json", {cache:"no-store"});
    const ok = r.ok;
    pill("fetch", ok, ok ? "FETCH OK" : "FETCH FAIL");
    const t = await r.text();
    log("faq.json bytes: " + t.length);
  }catch(e){
    pill("fetch", false, "FETCH ERR");
    log("Fetch error: " + e);
    log("Tip: otevři index.html online jednou, pak přepni offline a zkus znovu.");
  }
};
</script>
</body>
</html>
