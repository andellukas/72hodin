<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tábor</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#071521">
  <link rel="stylesheet" href="./shared/ui.css">
</head>
\1
<!-- test-v3-debug-panel -->
<div id="topbar" style="max-width:980px;margin:16px auto 8px;padding:12px 14px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(0,0,0,.25);backdrop-filter: blur(8px);">
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;">
    <div>
      <div style="font-size:18px;font-weight:700;line-height:1.2">Tábor</div>
      <div style="opacity:.8;font-size:12px;margin-top:2px">/test v3 • offline-ready debug</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
      <button id="reset_sw" type="button" style="cursor:pointer;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#fff;padding:8px 10px;border-radius:10px;font-weight:600">
        Reset cache / SW
      </button>
      <span id="sw_status" style="font-size:12px;opacity:.85">SW: (zjišťuju…)</span>
    </div>
  </div>
  <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;opacity:.9">
    <div>KB: <span id="kb_path">(loading)</span></div>
    <div>Řádky: <span id="kb_lines">-</span></div>
    <div>Byty: <span id="kb_bytes">-</span></div>
    <div>Položky: <span id="kb_items">-</span></div>
  </div>
</div>
<!-- /test-v3-debug-panel -->
  <div class="wrap">
    <div class="top">
      <div class="logo"><img id="cityLogo" alt="Logo města"></div>
      <div class="title">
        <b id="cityTitle">72 hodin</b>
        <span id="citySubtitle">Offline krizový vyhledávač (v3 /test)</span>
      </div>
    </div>

    <div class="search">
      <input id="q" autocomplete="off" inputmode="search" placeholder="Zadej dotaz (např. blackout, voda, zima, úraz)…">
      <button id="go" class="btn accent">Hledat</button>
      <small>Enter</small>
    </div>

    <div class="row">
      <a class="btn danger" href="tel:112">☎ 112</a>
      <a class="btn" href="tel:150">🚒 150</a>
      <a class="btn" href="tel:158">🚓 158</a>
      <a class="btn" href="tel:155">🚑 155</a>
      <button class="btn" id="installBtn" style="display:none">⬇️ Instalovat</button>
    </div>

    <div class="hint" id="status">Startuji…</div>
  </div>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="panel">
      <div class="panelHead">
        <b id="ovTitle">Výsledky</b>
        <button id="ovClose">Zavřít (Esc)</button>
      </div>
      <div class="results" id="results"></div>
    </div>
  </div>

    <script src="./search-core.js"></script>
  <script src="./app.js"></script>
</body>
</html>
