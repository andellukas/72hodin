<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Tábor</title>

  <style>
    :root{
      --bg:#070b12;
      --panel:#0e1624;
      --panel2:#0b1220;
      --line:rgba(255,255,255,.10);
      --txt:#eaf0f7;
      --muted:rgba(234,240,247,.70);
      --accent:rgba(120,180,255,.70);
      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --radius:22px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      background:
        radial-gradient(1200px 700px at 50% -10%, rgba(120,180,255,.18), transparent 55%),
        radial-gradient(900px 600px at 20% 10%, rgba(80,255,200,.08), transparent 55%),
        var(--bg);
      color:var(--txt);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }

    .wrap{max-width:980px;margin:0 auto;padding:28px 16px 56px}

    /* HERO */
    .hero{
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border:1px solid var(--line);
      border-radius:28px;
      padding:20px 16px 18px;
      box-shadow:var(--shadow);
      backdrop-filter: blur(10px);
    }

    .brand{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
      padding:10px 6px 4px;
    }

    .logoBox{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:8px 8px;
    }
    .logoBox img{
      width:min(860px, 100%);
      max-height:160px;
      height:auto;
      object-fit:contain;
      display:block;
      filter: drop-shadow(0 10px 26px rgba(0,0,0,.55));
    }

    .title{
      margin:0;
      text-align:center;
      font-weight:950;
      letter-spacing:.2px;
      font-size:clamp(34px, 5.2vw, 56px);
      line-height:1.02;
    }
    .subtitle{
      margin:0;
      text-align:center;
      color:var(--muted);
      font-size:clamp(14px, 1.9vw, 18px);
      line-height:1.35;
    }

    /* SEARCH */
    .search{
      margin:18px auto 0;
      max-width:820px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .input{
      width:100%;
      padding:18px 18px;
      border-radius:18px;
      border:1px solid var(--line);
      background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      color:var(--txt);
      font-size:18px;
      outline:none;
    }
    .input:focus{
      border-color:rgba(120,180,255,.55);
      box-shadow:0 0 0 4px rgba(120,180,255,.12);
    }
    .hint{
      text-align:center;
      color:var(--muted);
      font-size:13px;
    }

    /* RESULTS (no cards) */
    .results{margin:18px auto 0;max-width:820px}
    .item{
      padding:14px 6px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .item:last-child{border-bottom:none}
    .item .t{
      font-weight:900;
      margin:0 0 6px;
      font-size:16px;
      letter-spacing:.1px;
    }
    .item .p{
      margin:0;
      color:rgba(234,240,247,.86);
      white-space:pre-wrap;
      line-height:1.45;
    }

    /* MOBILE polish */
    @media (max-width:520px){
      .wrap{padding:22px 14px 44px}
      .hero{padding:18px 14px 16px}
      .logoBox img{max-height:130px}
      .input{padding:16px 16px}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <section class="hero">
      <div class="brand">
        <div class="logoBox">
          <img src="../assets/cities/tabor/logo.jpg" alt="Město Tábor">
        </div>
        <h1 class="title">72 hodin</h1>
        <p class="subtitle">Offline krizový vyhledávač pro občany města Tábor</p>

        <div class="search">
          <input id="q" class="input" type="search" placeholder="Hledej… (např. voda, blackout, evakuace)" autocomplete="off" />
          <div class="hint">Jedno pole. Jedno hledání. Funguje i bez internetu (po načtení do zařízení).</div>
        </div>
      </div>
    </section>

    <div id="results" class="results"></div>
  </div>

  <script src="./search-core.js"></script>
  <script src="./app.js"></script>
</body>
</html>
