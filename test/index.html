<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tábor</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <style>
    body{background:#0b0f14;color:#e6edf3;font-family:system-ui,-apple-system,Segoe UI,Roboto}
    .wrap{max-width:900px;margin:24px auto;padding:0 16px}
    .logo{display:flex;justify-content:center;margin:24px 0}
    .logo img{max-width:520px;width:100%;height:auto}
    .search{margin-top:16px}
    .search input{width:100%;padding:16px 18px;border-radius:16px;border:1px solid #1f2937;background:#0f1623;color:#fff;font-size:18px}
    .results{margin-top:18px}
    .card{padding:14px 16px;border-radius:16px;border:1px solid #1f2937;background:#0f1623;margin:12px 0}
    .card .t{font-weight:800;margin-bottom:6px}
    .card .p{white-space:pre-wrap;opacity:.92}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <img src="../assets/cities/tabor/logo.jpg" alt="Tábor">
    </div>

    <div class="search">
      <input id="q" type="search" placeholder="Hledej…" autocomplete="off" />
    </div>

    <div id="results" class="results"></div>
  </div>

  <script src="./search-core.js"></script>
  <script src="./app.js"></script>
</body>
</html>
